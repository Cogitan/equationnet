[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "equationnet"
version = "1.0.0"
description = "Type an equation: six simple models (three that use it, three data-only baselines), plus any of your own, are trained on your data and ranked on held-out points."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.12", "torch>=2.0", "questionary>=2.0"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Cogitan"}]
keywords = ["differential equations", "PINN", "model selection", "parameter estimation", "scientific machine learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/Cogitan/equationnet"
Issues = "https://github.com/Cogitan/equationnet/issues"

[project.scripts]
equationnet = "equationnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
equationnet = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
